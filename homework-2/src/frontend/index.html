<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support Tickets</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Agent Console</p>
          <h1>Support Tickets</h1>
        </div>
        <span id="api-status" class="status">Checking API...</span>
      </header>

      <section id="feedback" class="feedback" hidden></section>

      <section class="toolbar" aria-label="Ticket filters">
        <label>
          Category
          <select id="filter-category">
            <option value="">All</option>
          </select>
        </label>
        <label>
          Priority
          <select id="filter-priority">
            <option value="">All</option>
          </select>
        </label>
        <label>
          Status
          <select id="filter-status">
            <option value="">All</option>
          </select>
        </label>
        <button id="refresh-button" type="button">Refresh</button>
      </section>

      <div class="layout">
        <section class="ticket-list" aria-labelledby="ticket-list-title">
          <div class="section-head">
            <h2 id="ticket-list-title">Tickets</h2>
            <span id="ticket-count" class="muted">0 total</span>
          </div>
          <div id="tickets"></div>
        </section>

        <aside class="workspace" aria-label="Ticket workspace">
          <section class="panel">
            <div class="section-head">
              <h2 id="form-title">New Ticket</h2>
              <button id="reset-form-button" class="ghost" type="button">New</button>
            </div>

            <form id="ticket-form" novalidate>
              <input id="ticket-id" type="hidden">

              <div class="field-grid">
                <label>
                  Customer ID
                  <input id="customer-id" name="customer_id" required maxlength="100">
                </label>
                <label>
                  Customer Email
                  <input id="customer-email" name="customer_email" type="email" required>
                </label>
              </div>

              <label>
                Customer Name
                <input id="customer-name" name="customer_name" required maxlength="100">
              </label>

              <label>
                Subject
                <input id="subject" name="subject" required maxlength="200">
              </label>

              <label>
                Description
                <textarea id="description" name="description" required minlength="10" maxlength="2000"></textarea>
              </label>

              <div class="field-grid three">
                <label>
                  Category
                  <select id="category" name="category"></select>
                </label>
                <label>
                  Priority
                  <select id="priority" name="priority"></select>
                </label>
                <label>
                  Status
                  <select id="status" name="status"></select>
                </label>
              </div>

              <div class="field-grid">
                <label>
                  Assigned To
                  <input id="assigned-to" name="assigned_to" maxlength="100">
                </label>
                <label>
                  Tags
                  <input id="tags" name="tags" placeholder="billing, login">
                </label>
              </div>

              <div class="field-grid three">
                <label>
                  Source
                  <select id="metadata-source" name="source"></select>
                </label>
                <label>
                  Browser
                  <input id="metadata-browser" name="browser" maxlength="100">
                </label>
                <label>
                  Device
                  <select id="metadata-device" name="device_type">
                    <option value="">Unknown</option>
                  </select>
                </label>
              </div>

              <label class="checkbox">
                <input id="auto-classify" type="checkbox">
                Auto-classify
              </label>

              <div class="button-row">
                <button id="save-button" type="submit">Create Ticket</button>
                <button id="delete-button" class="danger" type="button" hidden>Delete</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <div class="section-head">
              <h2>Details</h2>
              <button id="classify-button" class="secondary" type="button" disabled>Classify</button>
            </div>
            <div id="ticket-detail" class="detail-empty">No ticket selected</div>
          </section>

          <section class="panel">
            <h2>Import</h2>
            <form id="import-form">
              <label>
                File
                <input id="import-file" type="file" accept=".csv,.json,.xml" required>
              </label>
              <button type="submit">Import Tickets</button>
            </form>
            <pre id="import-result" class="import-result" hidden></pre>
          </section>
        </aside>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
